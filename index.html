<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MultiMail Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- TEMA DARK NEON GREEN --- */
        :root {
            --primary-color: #00e676;      /* Verde Neon (Destaque) */
            --bg-color: #0d0d0d;           /* Preto Fundo */
            --card-color: #1a1a1a;         /* Cinza Escuro (Cartão) */
            --text-color: #ffffff;         /* Texto Branco */
            --input-bg: #000000;           /* Fundo dos Inputs */
            --border-color: #333333;       /* Bordas sutis */
            --danger-color: #ff5252;       /* Vermelho para botão Sair/Limpar */
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        /* O Cartão Principal */
        .card {
            background-color: var(--card-color);
            padding: 40px;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 4px 20px rgba(0, 230, 118, 0.1); /* Brilho verde sutil */
            border: 1px solid var(--border-color);
            text-align: center;
        }

        /* Ícone e Títulos */
        .icon {
            font-size: 48px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(0, 230, 118, 0.4);
        }

        h1 {
            color: var(--primary-color);
            margin: 5px 0;
            font-size: 26px;
        }

        p.subtitle {
            color: #888;
            font-size: 14px;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }

        /* Área de Login */
        .user-area {
            margin-bottom: 20px;
        }

        .btn-login {
            background-color: var(--primary-color);
            color: #000; /* Texto preto no verde fica muito legível */
            border: none;
            width: 100%;
            padding: 12px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: opacity 0.3s;
        }

        .btn-login:hover {
            opacity: 0.9;
            box-shadow: 0 0 10px var(--primary-color);
        }

        /* Perfil Logado */
        .user-profile {
            display: none; 
            background-color: #252525;
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            align-items: center;
            justify-content: space-between;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            text-align: left;
        }

        .user-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 2px solid var(--primary-color);
        }

        .user-name {
            font-weight: bold;
            font-size: 14px;
            color: var(--primary-color);
        }

        .user-email {
            font-size: 11px;
            color: #aaa;
        }

        .btn-logout {
            background: transparent;
            border: 1px solid #555;
            color: #ccc;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }

        .btn-logout:hover {
            border-color: var(--danger-color);
            color: var(--danger-color);
        }

        /* Formulário */
        .form-section {
            background-color: #222;
            padding: 20px;
            border-radius: 8px;
            text-align: left;
            border: 1px solid var(--border-color);
        }

        label {
            display: block;
            color: var(--primary-color);
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 8px;
            margin-top: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 12px;
            background-color: var(--input-bg);
            border: 1px solid #444;
            border-radius: 5px;
            color: white;
            box-sizing: border-box;
            font-family: monospace; /* Fonte estilo código */
        }
        
        input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 5px rgba(0, 230, 118, 0.3);
        }

        .helper-text {
            font-size: 11px;
            color: #666;
            margin-top: 5px;
        }

        /* Botões de Ação */
        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 2fr; /* Botão Gerar maior que o Limpar */
            gap: 10px;
            margin-top: 25px;
        }

        .btn-generate {
            background-color: var(--primary-color);
            color: #000;
            border: none;
            padding: 12px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-generate:hover {
            box-shadow: 0 0 15px rgba(0, 230, 118, 0.4);
        }

        .btn-clear {
            background-color: transparent;
            color: #888;
            border: 1px solid #444;
            padding: 12px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-clear:hover {
            border-color: var(--danger-color);
            color: var(--danger-color);
            background-color: rgba(255, 82, 82, 0.1);
        }

        /* Área de Resultados */
        #result-area {
            margin-top: 20px;
            display: none;
        }

        .result-header {
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            margin-bottom: 5px;
        }

        .result-header label {
            margin: 0;
            color: var(--text-color);
            font-size: 12px;
        }

        #btnCopy {
            background: transparent;
            border: 1px solid #555;
            color: var(--primary-color);
            cursor: pointer;
            border-radius: 4px;
            padding: 5px 10px;
            font-size: 11px;
            transition: all 0.3s;
        }

        #btnCopy:hover {
            background-color: rgba(0, 230, 118, 0.1);
            border-color: var(--primary-color);
        }

        textarea {
            width: 100%;
            height: 150px;
            background-color: #000;
            color: var(--primary-color); /* Texto verde estilo Matrix */
            border: 1px solid #333;
            padding: 10px;
            border-radius: 5px;
            box-sizing: border-box;
            resize: vertical;
            font-family: monospace;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon">✉️</div>
        <h1>MultiMail Generator</h1>
        <p class="subtitle">Gerador de Gmails Profissional</p>

        <div class="user-area">
            <button id="btnLogin" class="btn-login">
                <span style="font-size: 18px;">G</span> Entrar com Google
            </button>

            <div id="userProfile" class="user-profile">
                <div class="user-info">
                    <img id="userAvatar" class="user-avatar" src="" alt="Foto">
                    <div>
                        <div id="userName" class="user-name">Usuário</div>
                        <div id="userEmail" class="user-email">email@gmail.com</div>
                    </div>
                </div>
                <button id="btnLogout" class="btn-logout">Sair</button>
            </div>
        </div>

        <div class="form-section">
            <label>Seu e-mail principal:</label>
            <input type="email" id="emailInput" placeholder="exemplo@gmail.com">
            
            <label>Quantidade de aliases:</label>
            <input type="number" id="quantityInput" placeholder="5" min="1" max="100">
            <div class="helper-text">Cria variações com "+1", "+2", etc.</div>

            <div class="action-buttons">
                <button class="btn-clear" id="btnClear">🗑️ Limpar</button>
                <button class="btn-generate" id="btnGenerate">⚡ Gerar Gmails</button>
            </div>
        </div>

        <div id="result-area">
            <div class="result-header">
                <label>RESULTADO:</label>
                <button id="btnCopy">📋 Copiar Lista</button>
            </div>
            <textarea id="resultList" readonly></textarea>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // CONFIGURAÇÃO DO FIREBASE (Sua configuração original)
        const firebaseConfig = {
            apiKey: "AIzaSyDJqY0MzC2zF__B50ZeGzoeznlFWIqbJUA",
            authDomain: "gerador-8acb1.firebaseapp.com",
            projectId: "gerador-8acb1",
            storageBucket: "gerador-8acb1.firebasestorage.app",
            messagingSenderId: "990760189878",
            appId: "1:990760189878:web:623daf01f828273d274b17"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let usuarioAtual = null;

        // Elementos DOM
        const btnLogin = document.getElementById('btnLogin');
        const btnLogout = document.getElementById('btnLogout');
        const userProfile = document.getElementById('userProfile');
        const userAvatar = document.getElementById('userAvatar');
        const userName = document.getElementById('userName');
        const userEmail = document.getElementById('userEmail');
        
        const btnGenerate = document.getElementById('btnGenerate');
        const btnClear = document.getElementById('btnClear');
        const btnCopy = document.getElementById('btnCopy');
        const resultArea = document.getElementById('result-area');
        const emailInput = document.getElementById('emailInput');
        const quantityInput = document.getElementById('quantityInput');
        const resultList = document.getElementById('resultList');

        // --- AUTENTICAÇÃO ---
        btnLogin.addEventListener('click', () => {
            signInWithPopup(auth, provider).catch((error) => alert("Erro: " + error.message));
        });

        btnLogout.addEventListener('click', () => {
            signOut(auth);
        });

        onAuthStateChanged(auth, (user) => {
            usuarioAtual = user;
            if (user) {
                btnLogin.style.display = 'none';
                userProfile.style.display = 'flex';
                userName.textContent = user.displayName;
                userEmail.textContent = user.email;
                userAvatar.src = user.photoURL;
                if(emailInput.value === "") emailInput.value = user.email;
            } else {
                btnLogin.style.display = 'flex';
                userProfile.style.display = 'none';
            }
        });

        // --- FUNÇÕES ---

        // 1. GERAR E SALVAR
        btnGenerate.addEventListener('click', async () => {
            const emailOriginal = emailInput.value.trim();
            let quantidade = parseInt(quantityInput.value);

            if (!emailOriginal.includes('@gmail.com')) {
                alert('Insira um e-mail Gmail válido.');
                return;
            }
            if (!quantidade || quantidade < 1) quantidade = 1;
            if (quantidade > 1000) quantidade = 1000;

            const [usuario, dominio] = emailOriginal.split('@');
            let listaEmails = "";
            let arrayParaSalvar = [];

            for (let i = 1; i <= quantidade; i++) {
                const novo = `${usuario}+${i}@${dominio}`;
                listaEmails += novo + "\n";
                arrayParaSalvar.push(novo);
            }

            resultList.value = listaEmails;
            resultArea.style.display = 'block';

            if (usuarioAtual) {
                const originalText = btnGenerate.innerHTML;
                btnGenerate.innerHTML = "💾 Salvando...";
                btnGenerate.disabled = true;

                try {
                    await addDoc(collection(db, "historico_emails"), {
                        uid: usuarioAtual.uid,
                        nome: usuarioAtual.displayName,
                        email_base: emailOriginal,
                        emails_gerados: arrayParaSalvar,
                        quantidade: quantidade,
                        data: serverTimestamp()
                    });
                    btnGenerate.innerHTML = "✅ Salvo!";
                } catch (e) {
                    console.error(e);
                    btnGenerate.innerHTML = "⚠️ Erro";
                }

                setTimeout(() => {
                    btnGenerate.innerHTML = originalText;
                    btnGenerate.disabled = false;
                }, 2000);
            }
        });

        // 2. LIMPAR TELA
        btnClear.addEventListener('click', () => {
            quantityInput.value = "";
            resultList.value = "";
            resultArea.style.display = 'none';
            
            const textoOriginal = btnClear.innerHTML;
            btnClear.innerHTML = "🧹 Limpo!";
            setTimeout(() => {
                btnClear.innerHTML = textoOriginal;
            }, 1000);
        });

        // 3. COPIAR
        btnCopy.addEventListener('click', () => {
            resultList.select();
            resultList.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(resultList.value).then(() => {
                const original = btnCopy.innerHTML;
                btnCopy.innerHTML = "✅ Copiado!";
                btnCopy.style.borderColor = "#00e676";
                btnCopy.style.color = "#00e676";
                setTimeout(() => {
                    btnCopy.innerHTML = original;
                    btnCopy.style.borderColor = "#555";
                    btnCopy.style.color = "#00e676";
                }, 2000);
            });
        });
    </script>
</body>
</html>
