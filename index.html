<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MultiMail Generator</title>
    <style>
        :root {
            --primary-color: #ffc107;
            --bg-color: #0d0d0d;
            --card-color: #1a1a1a;
            --text-color: #ffffff;
            --input-bg: #000000;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background-color: var(--card-color);
            padding: 40px;
            border-radius: 10px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid #333;
            text-align: center;
        }

        .icon {
            font-size: 40px;
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        h1 {
            color: var(--primary-color);
            margin: 10px 0 5px 0;
        }

        p.subtitle {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 30px;
            border-bottom: 1px solid #333;
            padding-bottom: 20px;
        }

        /* Área do Usuário (Login) */
        .user-area {
            margin-bottom: 20px;
        }

        .btn-login {
            background-color: var(--primary-color);
            color: #000;
            border: none;
            width: 100%;
            padding: 12px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: opacity 0.3s;
            display: block; /* Visível por padrão */
        }

        /* Perfil do Usuário (Escondido inicialmente) */
        .user-profile {
            display: none; 
            background-color: #252525;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #333;
            align-items: center;
            justify-content: space-between;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            text-align: left;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid var(--primary-color);
        }

        .user-name {
            font-weight: bold;
            font-size: 14px;
            color: var(--primary-color);
        }

        .user-email {
            font-size: 11px;
            color: #aaa;
        }

        .btn-logout {
            background: transparent;
            border: 1px solid #555;
            color: #fff;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
        }

        .btn-logout:hover {
            background-color: #333;
        }

        /* Restante do CSS igual ao anterior */
        .form-section {
            background-color: #252525;
            padding: 20px;
            border-radius: 8px;
            text-align: left;
            border: 1px solid #333;
        }

        .section-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .description {
            font-size: 12px;
            color: #ccc;
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: var(--primary-color);
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 8px;
            margin-top: 15px;
        }

        input {
            width: 100%;
            padding: 12px;
            background-color: var(--input-bg);
            border: 1px solid #444;
            border-radius: 5px;
            color: white;
            box-sizing: border-box;
        }
        
        input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .helper-text {
            font-size: 11px;
            color: #666;
            margin-top: 5px;
        }

        .btn-generate {
            background-color: var(--primary-color);
            color: #000;
            border: none;
            width: 100%;
            padding: 12px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: opacity 0.3s;
        }

        .btn-generate:hover, .btn-login:hover {
            opacity: 0.9;
        }

        #result-area {
            margin-top: 20px;
            display: none;
        }

        .result-header {
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            margin-bottom: 5px;
        }

        #btnCopy {
            background: transparent;
            border: 1px solid #555;
            color: var(--primary-color);
            cursor: pointer;
            border-radius: 4px;
            padding: 5px 10px;
            font-size: 12px;
            transition: all 0.3s;
        }

        textarea {
            width: 100%;
            height: 150px;
            background-color: #000;
            color: #fff;
            border: 1px solid #444;
            padding: 10px;
            border-radius: 5px;
            box-sizing: border-box;
            resize: vertical;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon">✉️</div>
        <h1>MultiMail Generator</h1>
        <p class="subtitle">Gerador de Gmails</p>

        <div class="user-area">
            <button id="btnLogin" class="btn-login">
                <span style="margin-right: 5px;">G</span> Entrar com Google
            </button>

            <div id="userProfile" class="user-profile">
                <div class="user-info">
                    <img id="userAvatar" class="user-avatar" src="" alt="Foto">
                    <div>
                        <div id="userName" class="user-name">Usuário</div>
                        <div id="userEmail" class="user-email">email@gmail.com</div>
                    </div>
                </div>
                <button id="btnLogout" class="btn-logout">Sair</button>
            </div>
        </div>

        <div class="form-section">
            <div class="section-title">✏️ Criar Gmails</div>
            <p class="description">Crie gmails ilimitados. Todos os e-mails chegam na sua caixa principal!</p>

            <label>Seu e-mail do Gmail:</label>
            <input type="email" id="emailInput" placeholder="seu.email@gmail.com">
            <div class="helper-text">Exemplo: seu.email@gmail.com</div>

            <label>Quantos gmails criar? (1-100):</label>
            <input type="number" id="quantityInput" placeholder="5" min="1" max="100">
            <div class="helper-text">Escolha quantos gmails você quer gerar (máximo 100)</div>

            <button class="btn-generate" id="btnGenerate">⚡ Gerar Gmails</button>
        </div>

        <div id="result-area">
            <div class="result-header">
                <label>Seus novos e-mails:</label>
                <button id="btnCopy">📋 Copiar Lista</button>
            </div>
            <textarea id="resultList" readonly></textarea>
        </div>
    </div>

    <script type="module">
        // 1. Importar as ferramentas do Firebase (versão Web)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 2. Configuração do TEU Projeto (Copiada do teu print)
        const firebaseConfig = {
            apiKey: "AIzaSyDJqY0MzC2zF__B50ZeGzoeznlFWIqbJUA",
            authDomain: "gerador-8acb1.firebaseapp.com",
            projectId: "gerador-8acb1",
            storageBucket: "gerador-8acb1.firebasestorage.app",
            messagingSenderId: "990760189878",
            appId: "1:990760189878:web:623daf01f828273d274b17"
        };

        // 3. Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // 4. Elementos da Tela
        const btnLogin = document.getElementById('btnLogin');
        const btnLogout = document.getElementById('btnLogout');
        const userProfile = document.getElementById('userProfile');
        const userAvatar = document.getElementById('userAvatar');
        const userName = document.getElementById('userName');
        const userEmail = document.getElementById('userEmail');

        // 5. Função de Login
        btnLogin.addEventListener('click', () => {
            signInWithPopup(auth, provider)
                .then((result) => {
                    console.log("Login sucesso:", result.user);
                }).catch((error) => {
                    console.error("Erro login:", error);
                    alert("Erro ao fazer login: " + error.message);
                });
        });

        // 6. Função de Logout
        btnLogout.addEventListener('click', () => {
            signOut(auth).then(() => {
                console.log("Saiu da conta");
            });
        });

        // 7. Monitorar: O usuário está logado ou não?
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // Usuário LOGADO: Esconde botão login, mostra perfil
                btnLogin.style.display = 'none';
                userProfile.style.display = 'flex';
                
                // Preenche os dados
                userName.textContent = user.displayName;
                userEmail.textContent = user.email;
                userAvatar.src = user.photoURL;

                // (Opcional) Preenche o campo de e-mail automaticamente
                const emailInput = document.getElementById('emailInput');
                if(emailInput.value === "") {
                    emailInput.value = user.email;
                }

            } else {
                // Usuário DESLOGADO: Mostra botão login, esconde perfil
                btnLogin.style.display = 'block';
                userProfile.style.display = 'none';
            }
        });

        // --- LÓGICA DO GERADOR (Mantida e adaptada para Module) ---
        
        // Precisamos adicionar os eventos manualmente porque "module" não permite onclick no HTML
        document.getElementById('btnGenerate').addEventListener('click', gerarGmails);
        document.getElementById('btnCopy').addEventListener('click', copiarTexto);

        function gerarGmails() {
            const emailOriginal = document.getElementById('emailInput').value.trim();
            let quantidade = parseInt(document.getElementById('quantityInput').value);

            if (!emailOriginal.includes('@gmail.com')) {
                alert('Por favor, insira um endereço @gmail.com válido.');
                return;
            }
            if (!quantidade || quantidade < 1) quantidade = 1;
            if (quantidade > 1000) quantidade = 1000;

            const partes = emailOriginal.split('@');
            const usuario = partes[0];
            const dominio = partes[1];

            let listaEmails = "";

            for (let i = 1; i <= quantidade; i++) {
                const novoEmail = `${usuario}+${i}@${dominio}`;
                listaEmails += novoEmail + "\n";
            }

            const areaResultado = document.getElementById('result-area');
            const campoTexto = document.getElementById('resultList');
            
            campoTexto.value = listaEmails;
            areaResultado.style.display = 'block';
        }

        function copiarTexto() {
            const texto = document.getElementById('resultList');
            texto.select();
            texto.setSelectionRange(0, 99999);

            navigator.clipboard.writeText(texto.value).then(() => {
                const btn = document.getElementById('btnCopy');
                const textoOriginal = btn.innerHTML;
                
                btn.innerHTML = "✅ Copiado!";
                btn.style.borderColor = "#4CAF50";
                btn.style.color = "#4CAF50";

                setTimeout(() => {
                    btn.innerHTML = textoOriginal;
                    btn.style.borderColor = "#555";
                    btn.style.color = "#ffc107";
                }, 2000);
            }).catch(err => {
                console.error(err);
                alert('Erro ao copiar.');
            });
        }
    </script>

</body>
</html>
