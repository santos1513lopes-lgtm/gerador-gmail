<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MultiMail Generator Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- VARIÁVEIS DE CORES (NOVO TEMA: CLEAN BLUE) --- */
        :root {
            --primary-color: #2563eb;      /* Azul Royal */
            --primary-hover: #1d4ed8;      /* Azul Escuro (ao passar o mouse) */
            --bg-body: #f3f4f6;            /* Cinza muito claro (Fundo da página) */
            --bg-card: #ffffff;            /* Branco (Cartão) */
            --text-main: #1f2937;          /* Cinza Escuro (Texto Principal) */
            --text-secondary: #6b7280;     /* Cinza Médio (Legendas) */
            --border-color: #e5e7eb;       /* Cinza Claro (Bordas) */
            --danger-color: #ef4444;       /* Vermelho (Para erros ou limpar) */
            --success-color: #10b981;      /* Verde (Sucesso) */
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        /* Container Principal */
        .card {
            background-color: var(--bg-card);
            padding: 40px;
            border-radius: 16px; /* Cantos mais arredondados */
            width: 100%;
            max-width: 480px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); /* Sombra suave e elegante */
            border: 1px solid var(--border-color);
            text-align: center;
        }

        /* Cabeçalho */
        .icon {
            font-size: 48px;
            margin-bottom: 15px;
            background: #dbeafe; /* Fundo azul claro no ícone */
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            margin-left: auto;
            margin-right: auto;
        }

        h1 {
            color: var(--text-main);
            margin: 0;
            font-size: 24px;
            font-weight: 700;
        }

        p.subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            margin-top: 5px;
            margin-bottom: 25px;
        }

        /* Área de Login */
        .user-area {
            margin-bottom: 25px;
            padding-bottom: 25px;
            border-bottom: 1px solid var(--border-color);
        }

        .btn-login {
            background-color: #fff;
            color: var(--text-main);
            border: 1px solid #d1d5db;
            width: 100%;
            padding: 12px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s;
        }

        .btn-login:hover {
            background-color: #f9fafb;
            border-color: var(--primary-color);
        }

        /* Perfil Logado */
        .user-profile {
            display: none; /* Escondido por padrão */
            background-color: #eff6ff; /* Azulzinho muito claro */
            padding: 12px;
            border-radius: 10px;
            align-items: center;
            justify-content: space-between;
            border: 1px solid #bfdbfe;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            text-align: left;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .user-name {
            font-weight: 700;
            font-size: 14px;
            color: var(--primary-color);
        }

        .user-email {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .btn-logout {
            background: white;
            border: 1px solid #fab1b1;
            color: var(--danger-color);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }
        
        .btn-logout:hover {
            background-color: #fef2f2;
        }

        /* Formulário */
        .form-section {
            text-align: left;
        }

        label {
            display: block;
            color: var(--text-main);
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 8px;
            margin-top: 15px;
        }

        input {
            width: 100%;
            padding: 14px;
            background-color: #f9fafb;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 15px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        
        input:focus {
            outline: none;
            border-color: var(--primary-color);
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .helper-text {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 6px;
        }

        /* Botões de Ação (Grid para ficarem lado a lado) */
        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr; /* Duas colunas iguais */
            gap: 10px;
            margin-top: 25px;
        }

        .btn-generate {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            transition: background-color 0.2s;
        }

        .btn-generate:hover {
            background-color: var(--primary-hover);
        }

        /* Botão Limpar (Novo) */
        .btn-clear {
            background-color: white;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            padding: 14px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            transition: all 0.2s;
        }

        .btn-clear:hover {
            background-color: #fef2f2;
            color: var(--danger-color);
            border-color: #fecaca;
        }

        /* Área de Resultados */
        #result-area {
            margin-top: 25px;
            display: none;
            background-color: #f8fafc;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        .result-header {
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            margin-bottom: 10px;
        }

        .result-header label {
            margin: 0;
            color: var(--primary-color);
        }

        #btnCopy {
            background: white;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            cursor: pointer;
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s;
        }

        #btnCopy:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        textarea {
            width: 100%;
            height: 150px;
            background-color: white;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 8px;
            box-sizing: border-box;
            resize: vertical;
            font-family: monospace; /* Fonte tipo código para os emails */
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon">📧</div>
        <h1>MultiMail Generator</h1>
        <p class="subtitle">Ferramenta profissional de e-mails</p>

        <div class="user-area">
            <button id="btnLogin" class="btn-login">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" alt="G">
                Entrar com Google
            </button>

            <div id="userProfile" class="user-profile">
                <div class="user-info">
                    <img id="userAvatar" class="user-avatar" src="" alt="Foto">
                    <div>
                        <div id="userName" class="user-name">Usuário</div>
                        <div id="userEmail" class="user-email">email@gmail.com</div>
                    </div>
                </div>
                <button id="btnLogout" class="btn-logout">Sair</button>
            </div>
        </div>

        <div class="form-section">
            <label>Seu e-mail principal:</label>
            <input type="email" id="emailInput" placeholder="exemplo@gmail.com">
            
            <label>Quantidade de aliases:</label>
            <input type="number" id="quantityInput" placeholder="5" min="1" max="100">
            <div class="helper-text">Gera variações com "+1", "+2", etc.</div>

            <div class="action-buttons">
                <button class="btn-clear" id="btnClear">🗑️ Limpar</button>
                <button class="btn-generate" id="btnGenerate">⚡ Gerar</button>
            </div>
        </div>

        <div id="result-area">
            <div class="result-header">
                <label>Resultado:</label>
                <button id="btnCopy">📋 Copiar</button>
            </div>
            <textarea id="resultList" readonly></textarea>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // TUAS CHAVES FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyDJqY0MzC2zF__B50ZeGzoeznlFWIqbJUA",
            authDomain: "gerador-8acb1.firebaseapp.com",
            projectId: "gerador-8acb1",
            storageBucket: "gerador-8acb1.firebasestorage.app",
            messagingSenderId: "990760189878",
            appId: "1:990760189878:web:623daf01f828273d274b17"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let usuarioAtual = null;

        // Elementos
        const btnLogin = document.getElementById('btnLogin');
        const btnLogout = document.getElementById('btnLogout');
        const userProfile = document.getElementById('userProfile');
        const userAvatar = document.getElementById('userAvatar');
        const userName = document.getElementById('userName');
        const userEmail = document.getElementById('userEmail');
        
        // Novos Elementos
        const btnGenerate = document.getElementById('btnGenerate');
        const btnClear = document.getElementById('btnClear');
        const btnCopy = document.getElementById('btnCopy');
        const resultArea = document.getElementById('result-area');
        const emailInput = document.getElementById('emailInput');
        const quantityInput = document.getElementById('quantityInput');
        const resultList = document.getElementById('resultList');

        // --- LOGIN ---
        btnLogin.addEventListener('click', () => {
            signInWithPopup(auth, provider).catch((error) => alert("Erro: " + error.message));
        });

        btnLogout.addEventListener('click', () => {
            signOut(auth);
        });

        onAuthStateChanged(auth, (user) => {
            usuarioAtual = user;
            if (user) {
                btnLogin.style.display = 'none';
                userProfile.style.display = 'flex';
                userName.textContent = user.displayName;
                userEmail.textContent = user.email;
                userAvatar.src = user.photoURL;
                if(emailInput.value === "") emailInput.value = user.email;
            } else {
                btnLogin.style.display = 'flex'; // Flex para alinhar ícone e texto
                userProfile.style.display = 'none';
            }
        });

        // --- FUNÇÕES PRINCIPAIS ---

        // 1. GERAR E SALVAR
        btnGenerate.addEventListener('click', async () => {
            const emailOriginal = emailInput.value.trim();
            let quantidade = parseInt(quantityInput.value);

            if (!emailOriginal.includes('@gmail.com')) {
                alert('Insira um e-mail Gmail válido.');
                return;
            }
            if (!quantidade || quantidade < 1) quantidade = 1;
            if (quantidade > 1000) quantidade = 1000;

            const [usuario, dominio] = emailOriginal.split('@');
            let listaEmails = "";
            let arrayParaSalvar = [];

            for (let i = 1; i <= quantidade; i++) {
                const novo = `${usuario}+${i}@${dominio}`;
                listaEmails += novo + "\n";
                arrayParaSalvar.push(novo);
            }

            resultList.value = listaEmails;
            resultArea.style.display = 'block';

            // Salvar no Firebase se logado
            if (usuarioAtual) {
                const originalText = btnGenerate.innerHTML;
                btnGenerate.innerHTML = "💾 Salvando...";
                btnGenerate.disabled = true; // Evita duplo clique

                try {
                    await addDoc(collection(db, "historico_emails"), {
                        uid: usuarioAtual.uid,
                        nome: usuarioAtual.displayName,
                        email_base: emailOriginal,
                        emails_gerados: arrayParaSalvar,
                        quantidade: quantidade,
                        data: serverTimestamp()
                    });
                    btnGenerate.innerHTML = "✅ Salvo!";
                } catch (e) {
                    console.error(e);
                    btnGenerate.innerHTML = "⚠️ Erro ao salvar";
                }

                setTimeout(() => {
                    btnGenerate.innerHTML = originalText;
                    btnGenerate.disabled = false;
                }, 2000);
            }
        });

        // 2. LIMPAR TELA (NOVO)
        btnClear.addEventListener('click', () => {
            // Limpa os inputs (mantém o email se o usuário quiser, mas vou limpar a qtde)
            quantityInput.value = "";
            resultList.value = "";
            resultArea.style.display = 'none';
            
            // Feedback no botão
            const textoOriginal = btnClear.innerHTML;
            btnClear.innerHTML = "🧹 Limpo!";
            setTimeout(() => {
                btnClear.innerHTML = textoOriginal;
            }, 1000);
        });

        // 3. COPIAR
        btnCopy.addEventListener('click', () => {
            resultList.select();
            resultList.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(resultList.value).then(() => {
                const original = btnCopy.innerHTML;
                btnCopy.innerHTML = "✅ Copiado!";
                btnCopy.style.borderColor = "var(--success-color)";
                btnCopy.style.color = "var(--success-color)";
                setTimeout(() => {
                    btnCopy.innerHTML = original;
                    btnCopy.style.borderColor = "var(--border-color)";
                    btnCopy.style.color = "var(--text-main)";
                }, 2000);
            });
        });
    </script>
</body>
</html>
